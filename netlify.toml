# Netlify: static site in public/, plus two functions for the paid-kit download pages.
[build]
  publish = "public"
  # Bundles templates/*.html into a JS module the functions can import (no npm install needed).
  command = "node scripts/build-templates.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# www -> bare domain (canonical is https://historiasdepasta.es/)
[[redirects]]
  from = "https://www.historiasdepasta.es/*"
  to = "https://historiasdepasta.es/:splat"
  status = 301
  force = true

# Old calculator URL (already in video descriptions and bios) -> new slug
[[redirects]]
  from = "/calculadora-coast-fire/*"
  to = "/calculadora-libertad-financiera/:splat"
  status = 301
  force = true

# The course lives on the studio site
[[redirects]]
  from = "/curso/*"
  to = "https://tajadastudios.com/curso/"
  status = 301
  force = true
